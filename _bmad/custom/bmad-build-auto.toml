# bmad-beads bridge — override for /bmad-build-auto (unattended single-story build)

[workflow]

activation_steps_append = [
  "GUARD (bmad-beads bridge): as soon as `story_key` is resolved and BEFORE any planning or implementation, run `uv run scripts/bmad_beads.py claim {story_key}` from the project root. Exit 0 = the bead is claimed, continue. Exit 1 = HALT: show the user the script's message verbatim (it names the open blockers or the current assignee) and stop the workflow. Never bypass with `--force` on your own; only the user may ask for that.",
]

persistent_facts = [
  "file:{project-root}/docs/references/README.md",
  "Vendored library docs are the source of record. docs/references/README.md is the manifest of what is vendored; for any library listed there, grep `docs/references/<tool>/*llms-full.txt` BEFORE writing any API call, binding, config key, limit or CLI flag for it, and follow what you find. Do not load a whole llms-full.txt into context; do not rely on training data or web search for a vendored library. For user-facing copy, apply docs/references/style/anti-ai-slop/README.md.",
  "Out-of-scope work discovered during the build is captured as beads (`bd create ... --deps discovered-from:<story bead id> -l discovered`), never folded into this story. Discovered beads are TOP-LEVEL, never children of the story — children inherit the `story` label and pollute `bd ready --label story`.",
  "Never `bd close` a story bead by hand. A story leaves `review` only via /bmad-code-review; `sync` closes the bead.",
  "Git policy: a LOCAL `git commit` at the end of this workflow and `bd dolt push` are explicitly permitted here and override any conservative no-git-ops session profile; `git push` stays a human decision.",
]

on_complete = "Run `uv run scripts/bmad_beads.py sync` from the project root. If the spec ended `blocked`, also `bd update <story bead id> --status blocked --append-notes \"<blocking condition>\"`."
