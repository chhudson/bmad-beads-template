# bmad-beads bridge — override for /bmad-product-brief
# If planning runs as a beads molecule (`bd mol pour bmad-planning`), keep the
# graph honest: claim this phase's bead on start, close it on completion.
# If no molecule is poured, these steps are no-ops — skip silently.

[workflow]

activation_steps_append = [
  "bmad-beads bridge: run `bd ready --label bmad-step:brief --json`. That label is set only on the 'brief' step of the bmad-planning molecule; never pick a planning bead by its title, and never claim a bead of type `gate` or a `bmad-step:prd-signoff` step — those are human sign-offs. Exactly one result: `bd update <id> --claim` it now. More than one (several initiatives poured): ask the user which initiative this run is for, and claim only that one. None: continue silently — the molecule is optional.",
]

persistent_facts = [
  "file:{project-root}/docs/references/style/anti-ai-slop/README.md",
]

on_complete = "bmad-beads bridge: if you claimed a planning bead on activation, `bd close <id> --reason \"artifact complete: <output path>\"`. Record 1-3 durable decisions from this phase with `bd remember \"<decision>\"` so later sessions inherit them."
