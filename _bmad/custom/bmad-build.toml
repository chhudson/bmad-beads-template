# bmad-beads bridge — override for /bmad-build
# Claim the bead when work starts; push the resulting status into beads when the build completes.

[workflow]

activation_steps_append = [
  "GUARD (bmad-beads bridge): as soon as `story_key` is resolved and BEFORE any planning or implementation, run `uv run scripts/bmad_beads.py claim {story_key}` from the project root. Exit 0 = the bead is claimed, continue. Exit 1 = HALT: show the user the script's message verbatim (it names the open blockers or the current assignee) and stop the workflow. Never bypass with `--force` on your own; only the user may ask for that.",
]

persistent_facts = [
  "Work discovered during the build that is out of scope for this story is captured in beads, not in prose: `bd create \"<title>\" -t task --deps discovered-from:<this story bead id> -l discovered` — then keep going. Do not silently widen the story.",
  "Durable project insights (a gotcha, a convention, a decision) go to `bd remember \"<insight>\"` so `bd prime` carries them into the next session.",
]

on_complete = "Run `uv run scripts/bmad_beads.py sync` from the project root so the bead reflects the sprint-status change (in-progress / review). Then run `bd dolt push` if a Dolt remote is configured (ignore the error if not)."
