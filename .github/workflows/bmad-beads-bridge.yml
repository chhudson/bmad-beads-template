# Tests the BMAD×beads BRIDGE only (scripts/bmad_beads.py and its unit tests).
# It says nothing about your project's own code: a green check here proves only
# that scripts/** still passes. Add your project's own workflow beside this one —
# nothing in this file will run code outside scripts/.
#
# Runs on every push and PR (no path filter) on purpose: the `test` job is a
# required status check on main, and a required check that never runs blocks
# the merge. It takes about ten seconds.
name: bridge tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run scripts/test_bmad_beads.py
      - run: uv run scripts/bmad_beads.py --help >/dev/null
