name: bridge tests
on:
  push:
    paths: ["scripts/**", ".github/workflows/bridge-tests.yml"]
  pull_request:
    paths: ["scripts/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run scripts/test_bmad_beads.py
      - run: uv run scripts/bmad_beads.py --help >/dev/null
